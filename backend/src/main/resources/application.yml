server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: devtalk
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      encoding: UTF-8
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/devtalk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${MYSQL_USERNAME:devtalk_user}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

llm:
  mode: ${LLM_MODE:mock}
  default:
    temperature: ${LLM_DEFAULT_TEMPERATURE:0.2}
    max-tokens: ${LLM_DEFAULT_MAX_TOKENS:65536}
  context:
    tail:
      max-messages: ${LLM_CONTEXT_TAIL_MAX_MESSAGES:12}
      max-chars: ${LLM_CONTEXT_TAIL_MAX_CHARS:6000}
    summary:
      prompt-max-chars: ${LLM_CONTEXT_SUMMARY_PROMPT_MAX_CHARS:1000}
      hard-max-chars: ${LLM_CONTEXT_SUMMARY_HARD_MAX_CHARS:1200}
      keep-tail-messages: ${LLM_CONTEXT_SUMMARY_KEEP_TAIL_MESSAGES:12}
    continue:
      max-rounds: ${LLM_CONTINUE_MAX_ROUNDS:2}
      anchor-chars: ${LLM_CONTINUE_ANCHOR_CHARS:200}
  stream:
    sse-emitter-timeout-ms: ${LLM_SSE_EMITTER_TIMEOUT_MS:180000}
    executor:
      core-pool-size: ${LLM_STREAM_EXECUTOR_CORE_POOL_SIZE:4}
      max-pool-size: ${LLM_STREAM_EXECUTOR_MAX_POOL_SIZE:8}
      queue-capacity: ${LLM_STREAM_EXECUTOR_QUEUE_CAPACITY:100}
  mock:
    always-fail: ${LLM_MOCK_ALWAYS_FAIL:false}
  gemini:
    base-url: ${LLM_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${LLM_GEMINI_API_KEY:}
    model: ${LLM_GEMINI_MODEL:gemini-2.5-flash}
    connect-timeout-ms: ${LLM_GEMINI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${LLM_GEMINI_READ_TIMEOUT_MS:15000}
    stream-response-timeout-ms: ${LLM_GEMINI_STREAM_RESPONSE_TIMEOUT_MS:60000}
  ollama:
    base-url: ${LLM_OLLAMA_BASE_URL:http://ollama:11434}
    model: ${LLM_OLLAMA_MODEL:qwen2.5:3b}
    connect-timeout-ms: ${LLM_OLLAMA_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${LLM_OLLAMA_READ_TIMEOUT_MS:60000}
    stream-response-timeout-ms: ${LLM_OLLAMA_STREAM_RESPONSE_TIMEOUT_MS:120000}

devtalk:
  prompt:
    include-system: false
    include-failed: false
    include-ai: true
    max-chars: 8000
