services:
  devtalk-db:
    image: mysql:8.4
    container_name: devtalk-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - devtalk_db_data:/var/lib/mysql
      - ../backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - warruru-shared

  devtalk-backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    container_name: devtalk-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SERVER_PORT}
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE}
      MYSQL_URL: ${MYSQL_URL}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      LLM_MODE: ${LLM_MODE}
      LLM_GEMINI_API_KEY: ${LLM_GEMINI_API_KEY}
      LLM_GEMINI_MODEL: ${LLM_GEMINI_MODEL}
      LLM_GEMINI_BASE_URL: ${LLM_GEMINI_BASE_URL}
      LLM_GEMINI_CONNECT_TIMEOUT_MS: ${LLM_GEMINI_CONNECT_TIMEOUT_MS}
      LLM_GEMINI_READ_TIMEOUT_MS: ${LLM_GEMINI_READ_TIMEOUT_MS}
      LLM_GEMINI_STREAM_RESPONSE_TIMEOUT_MS: ${LLM_GEMINI_STREAM_RESPONSE_TIMEOUT_MS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      devtalk-db:
        condition: service_healthy
    ports:
      - "${DEVTALK_BACKEND_DEBUG_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - warruru-shared

  devtalk-frontend:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: devtalk-frontend
    restart: unless-stopped
    depends_on:
      devtalk-backend:
        condition: service_healthy
    ports:
      - "${DEVTALK_FRONTEND_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - warruru-shared

volumes:
  devtalk_db_data:

networks:
  warruru-shared:
    name: warruru-shared
    external: true
